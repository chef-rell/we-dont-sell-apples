# Event-driven task notifications (monitoring policy layer 1 — see issue #107).
#
# Fires within seconds of the events each dev acts on and POSTs a small JSON
# payload to that dev's webhook endpoint. Endpoint URLs live ONLY in repo
# Actions secrets (DEV_A_WEBHOOK_URL / DEV_B_WEBHOOK_URL) — this repo is
# public, so a URL committed here would be spammable by anyone. A missing
# secret makes that dev's step a silent no-op, so this file is safe to land
# before the endpoints exist.
name: notify-assignments

on:
  issues:
    types: [assigned]
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Dev B (OverlookBoz)
        if: >
          (github.event_name == 'issues' && github.event.assignee.login == 'OverlookBoz') ||
          (github.event_name == 'pull_request' && github.event.requested_reviewer.login == 'OverlookBoz') ||
          (github.event_name == 'issue_comment' && github.event.comment.user.login == 'chef-rell')
        env:
          URL: ${{ secrets.DEV_B_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          LINK: ${{ github.event.comment.html_url || github.event.issue.html_url || github.event.pull_request.html_url }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          [ -z "$URL" ] && { echo "DEV_B_WEBHOOK_URL not set — skipping"; exit 0; }
          jq -n --arg dev "B" --arg event "$EVENT" --arg action "$ACTION" \
                --arg title "$TITLE" --arg url "$LINK" --arg sender "$SENDER" \
                '{dev:$dev, event:$event, action:$action, title:$title, url:$url, sender:$sender}' \
            | curl -fsS -X POST "$URL" -H 'Content-Type: application/json' -d @- || true

      - name: Notify Dev A (chef-rell)
        if: >
          (github.event_name == 'issues' && github.event.assignee.login == 'chef-rell') ||
          (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'dev-b')) ||
          (github.event_name == 'issue_comment' && github.event.comment.user.login == 'OverlookBoz')
        env:
          URL: ${{ secrets.DEV_A_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          LINK: ${{ github.event.comment.html_url || github.event.issue.html_url || github.event.pull_request.html_url }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          [ -z "$URL" ] && { echo "DEV_A_WEBHOOK_URL not set — skipping"; exit 0; }
          jq -n --arg dev "A" --arg event "$EVENT" --arg action "$ACTION" \
                --arg title "$TITLE" --arg url "$LINK" --arg sender "$SENDER" \
                '{dev:$dev, event:$event, action:$action, title:$title, url:$url, sender:$sender}' \
            | curl -fsS -X POST "$URL" -H 'Content-Type: application/json' -d @- || true
